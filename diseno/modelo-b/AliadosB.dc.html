<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aliados — Modelo B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1248px; height: 260px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B2230">
<div style="grid-column: span 8; display: flex; flex-direction: column; gap: 16px">
<h3 style="margin: 0; font-size: 20px; font-weight: 800; color: #0B2545">Aseguradoras aliadas</h3>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{aseguradoras}}" as="a" hint-placeholder-count="6">
<div style="height: 96px; border-radius: 16px; border: 1px solid #E3DED3; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 17px; font-weight: 700; color: #5B6475">{{a}}</span><span style="font-size: 12px; color: #6B7385">[Logo]</span></div>
</sc-for>
</div>
</div>
<div style="grid-column: span 4; display: flex; flex-direction: column; gap: 16px">
<h3 style="margin: 0; font-size: 20px; font-weight: 800; color: #0B2545">Financiación</h3>
<div style="height: 96px; border-radius: 16px; border: 1px solid #E3DED3; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 17px; font-weight: 700; color: #5B6475">CrediSeguro</span><span style="font-size: 12px; color: #6B7385">[Logo]</span></div>
<div style="height: 96px; border-radius: 16px; border: 1px solid #E3DED3; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 17px; font-weight: 700; color: #5B6475">Finesa</span><span style="font-size: 12px; color: #6B7385">[Logo]</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1248,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    return { aseguradoras: ['SBS Seguros', 'AXA Colpatria', 'Seguros Mundial', 'Equidad Seguros', 'Chubb Seguros', 'HDI Seguros'] };
  }
}
</script>
</body>
</html>
