<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Te llamamos — Modelo B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
input,select{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
</style>
</helmet>
<section style="width: 1440px; height: 360px; box-sizing: border-box; padding: 56px 96px; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B2230">
<div style="height: 100%; box-sizing: border-box; padding: 0 56px; border-radius: 28px; background: #0B2545; position: relative; overflow: hidden; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px; align-items: center">
<svg width="380" height="209" viewBox="0 0 400 220" fill="none" stroke="#C9A45C" stroke-width="0.9" aria-hidden="true" style="position: absolute; left: -60px; bottom: -70px; opacity: 0.25">
<path d="M20 200 A180 180 0 0 1 380 200"></path><path d="M60 200 A140 140 0 0 1 340 200"></path><path d="M100 200 A100 100 0 0 1 300 200"></path>
<path d="M200 200 L44.1 110"></path><path d="M200 200 L110 44.1"></path><path d="M200 200 L200 20"></path><path d="M200 200 L290 44.1"></path><path d="M200 200 L355.9 110"></path>
</svg>
<div style="grid-column: span 5; display: flex; flex-direction: column; gap: 12px; position: relative">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #E4C98F">Te llamamos</span>
<h2 style="margin: 0; font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; color: #FFFFFF">Déjanos tu número y un asesor te contacta</h2>
<p style="margin: 0; font-size: 15.5px; line-height: 1.6; color: #C8D3E3">Te ayudamos a elegir, cotizar y financiar tu póliza.</p>
</div>
<form style="grid-column: span 7; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; position: relative">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #C8D3E3">Nombre
<input type="text" name="nombre" placeholder="Tu nombre" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 15px; color: #1B2230">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #C8D3E3">Celular
<input type="tel" name="celular" placeholder="300 000 0000" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 15px; color: #1B2230">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #C8D3E3">¿Qué quieres asegurar?
<select name="tipo" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 15px; color: #1B2230">
<option>Mi vehículo</option>
<option>Mi empresa</option>
<option>Mi vida y mi familia</option>
<option>Mi carga o mercancía</option>
<option>Un contrato (cumplimiento)</option>
</select>
</label>
<div style="display: flex; align-items: flex-end">
<button type="submit" style="width: 100%; height: 50px; border: 0; border-radius: 12px; background: #C9A45C; color: #0B2545; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15.5px; font-weight: 800; cursor: pointer">Quiero que me llamen</button>
</div>
</form>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":360}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
